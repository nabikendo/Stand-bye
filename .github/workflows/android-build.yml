name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js (Version 24)
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Setup Java JDK (Version 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare Workspace and Install Packages
      run: |
        echo '{"name": "standbye", "version": "1.0.0", "dependencies": {}}' > package.json
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

    - name: Build Android Project Structure
      run: |
        npx cap add android --confirm || true
        npx cap sync android

    - name: Compile App via Gradle
      run: |
        cd android && ./gradlew assembleDebug

    - name: Export Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StandBye-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
