name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Travado no Ubuntu 24.04 para garantir estabilidade máxima com as ferramentas Android
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js (Version 24)
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Setup Java JDK (Version 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create Package Manifest
      run: |
        echo '{"name": "standbye", "version": "1.0.0", "dependencies": {}}' > package.json

    - name: Install Capacitor Packages
      run: |
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

    - name: Initialize Capacitor Config
      run: npx cap init StandBye com.nabikendo.standbye --web-dir=. --confirm

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Web Code into Android
      run: npx cap sync android

    - name: Build Android App (APK)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: StandBye-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
