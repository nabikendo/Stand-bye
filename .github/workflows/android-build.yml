name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Força o uso do Ubuntu 22.04 para evitar falhas com a transição do Ubuntu 26
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js (Version 22)
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK (Version 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Package Manifest
      run: |
        echo '{"name": "standbye", "version": "1.0.0", "dependencies": {}}' > package.json

    - name: Install Capacitor Packages
      run: |
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

    - name: Add Android Native Platform
      run: |
        npx cap add android --confirm || true

    - name: Sync Web Code into Android
      run: npx cap sync android

    - name: Build Android App (APK)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: StandBye-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
