<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open StandBy Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container Principal (AMOLED_CLOCK_DUO) -->
    <main id="standby-container" class="day-mode">
        <div class="duo-layout">
            <!-- Lado Esquerdo: Relógio Minimalista -->
            <section class="widget clock-widget">
                <div id="digital-clock">00:00</div>
                <div id="current-date">--/--</div>
            </section>

            <!-- Lado Direito: Widget de Bateria -->
            <section class="widget info-widget">
                <div class="battery-dots-container">
                    <span id="battery-badge">--%</span>
                </div>
            </section>
        </div>
    </main>

    <!-- Camada de Grade Xadrez Anti-Burn-In -->
    <div id="checkerboard-overlay"></div>

    <!-- Tela de aviso caso o celular seja colocado em pé (Portrait Guard) -->
    <div id="portrait-warning">
        <div class="warning-box">
            <p>🔄 Gire o aparelho de lado para ativar o StandBy</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
